name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Vet
        run: cd services/gateway && go vet ./...
      - name: Test
        run: cd services/gateway && go test ./...
      - name: Build image
        run: docker compose build
